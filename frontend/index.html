<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Empathic Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <div class="header-dot"></div>
      <span>Empathic</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="bubble">Hi! I'm here for you. Feel free to share what's on your mind. 💙</div>
      </div>
    </div>

    <div class="mode-bar">
      <span class="mode-label">Response mode:</span>
      <button class="mode-btn active" data-mode="casual">Casual</button>
      <button class="mode-btn" data-mode="comfort">Comfort</button>
      <button class="mode-btn" data-mode="advice">Advice</button>
    </div>

    <div class="chat-input-area">
      <textarea id="userInput" placeholder="Type how you feel..." rows="1"></textarea>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
